# Keep the free-tier Supabase project awake.
# Supabase pauses projects after ~1 week of zero API activity.
# This scheduled ping prevents that during development.
#
# Required GitHub secrets:
# - SUPABASE_PROJECT_URL: https://uabnikhculnhciwdmofe.supabase.co/rest/v1/
# - SUPABASE_ANON_KEY: your anon/public key
# - SUPABASE_ACCESS_TOKEN: personal access token from https://supabase.com/dashboard/account/tokens
# - SUPABASE_PROJECT_REF: uabnikhculnhciwdmofe (the project ref from the URL)

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Resume if paused (Management API)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -sf -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/resume" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" > /dev/null \
          && echo "Resume requested (or already active)."

      - name: Ping Supabase REST API
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf "$SUPABASE_PROJECT_URL" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null \
          && echo "Supabase is awake."
