# Keep the free-tier Supabase project awake.
# Supabase pauses projects after ~1 week of zero API activity.
# This scheduled ping prevents that during development.
#
# Required GitHub secrets:
# - SUPABASE_PROJECT_URL: e.g. https://uabnikhculnhciwdmofe.supabase.co
# - SUPABASE_ANON_KEY: your anon/public key
# - SUPABASE_ACCESS_TOKEN: personal access token from https://supabase.com/dashboard/account/tokens
# - SUPABASE_PROJECT_REF: uabnikhculnhciwdmofe (the project ref from the URL)
#
# NOTE: If the project was paused, resume is async — the ping retries
# with backoff to give Supabase time to bring the project back up.

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Resume if paused (Management API)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl -s -o /tmp/resume.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/resume" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json")
          echo "Resume HTTP ${HTTP_CODE}"
          cat /tmp/resume.json
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Resume requested — waiting 30s for project to come back up..."
            sleep 30
          elif [ "$HTTP_CODE" = "409" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "Project is already active or not paused."
          else
            echo "Unexpected resume response (HTTP ${HTTP_CODE}). Continuing anyway."
          fi

      - name: Ping Supabase REST API
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Query the shops table — this is a real DB hit that keeps the project alive.
          # Works whether SUPABASE_PROJECT_URL includes /rest/v1 or not.
          URL="${SUPABASE_PROJECT_URL%/}"
          if echo "$URL" | grep -q '/rest/v1$'; then
            PING_URL="${URL}/shops?select=id&limit=1"
          else
            PING_URL="${URL}/rest/v1/shops?select=id&limit=1"
          fi
          echo "Pinging ${PING_URL}"
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/ping.json -w "%{http_code}" \
              "$PING_URL" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            echo "Attempt ${attempt}: HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "Supabase is awake!"
              exit 0
            fi
            echo "Ping returned ${HTTP_CODE} (attempt ${attempt}/5). Retrying in 10s..."
            sleep 10
          done
          echo "All ping attempts failed. Last response:"
          cat /tmp/ping.json
          exit 1
